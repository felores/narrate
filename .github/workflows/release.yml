name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.plat }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            plat: linux-x64
            asset: narrate-linux-x64
            server: narrate-server-linux-x64
          - os: ubuntu-24.04-arm
            plat: linux-arm64
            asset: narrate-linux-arm64
            server: narrate-server-linux-arm64
          - os: macos-13
            plat: darwin-x64
            asset: narrate-darwin-x64
            server: narrate-server-darwin-x64
          - os: macos-latest
            plat: darwin-arm64
            asset: narrate-darwin-arm64
            server: narrate-server-darwin-arm64
          - os: windows-latest
            plat: windows-x64
            asset: narrate-windows-x64.exe
            server: narrate-server-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Build native binary
        shell: bash
        run: bash scripts/build.sh

      - name: Rename to platform assets
        shell: bash
        run: |
          mv dist/narrate "dist/${{ matrix.asset }}"
          mv dist/narrate-server "dist/${{ matrix.server }}"

      - name: Checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os
          lines = []
          for f in sorted(os.listdir("dist")):
              p = os.path.join("dist", f)
              if os.path.isfile(p):
                  h = hashlib.sha256(open(p, "rb").read()).hexdigest()
                  lines.append(f"{h}  {f}")
          open("dist/SHA256SUMS.txt", "w").write("\n".join(lines) + "\n")
          PY

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
